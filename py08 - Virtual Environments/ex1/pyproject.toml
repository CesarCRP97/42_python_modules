[project]
name = "matrix-loading"
version = "1.0.0"
description = "Matrix data analysis and dependency management demonstration"
requires-python = ">=3.10,<3.12"

dependencies = [
    "pandas==2.1.0",
    "numpy==1.25.0",
    "matplotlib==3.7.2",
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"
